<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>volcano</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer.min.js"></script>
    <style>
      body {
        margin: 0;
        background-color: #111; /* фон страницы */
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
        background-color: #111; /* фон окна */
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="4volcano.glb"
      camera-controls
      autoplay
      auto-rotate
      ar
      shadow-intensity="0.8"
      exposure="0.8"
      environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
      tone-mapping="neutral"
      alt="4volcano">
    </model-viewer>
  </body>
</html>
